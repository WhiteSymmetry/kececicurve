# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
# Dependabot configuration for automatic dependency updates

version: 2

updates:
  # 1) Python paketleri (Eğer conda kullanmıyorsanız açık kalsın)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10  # Tırnak işaretleri kaldırıldı
    ignore:
      - dependency-name: "example-package"
        versions: ["1.*"]

  # 2) GitHub Actions (actions/... ve github/...)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # 3) Node.js Paketleri
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  # 4) Conda Paketleri (environment.yml güncellemeleri için)
  - package-ecosystem: "conda"
    directory: "/"
    schedule:
      interval: "weekly"
