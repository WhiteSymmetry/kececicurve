name: Generate project.json

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Üretim modu"
        required: false
        default: "auto"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate project.json
        run: |
          python project_json.py --mode "${{ inputs.mode }}"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add project.json
          git diff --cached --quiet || git commit -m "chore: generate project.json"
          git push
